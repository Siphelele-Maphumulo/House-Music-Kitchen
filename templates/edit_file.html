 /* Music Upload Loader Styles */
.music-upload-loader {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.9);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    color: white;
    font-family: Arial, sans-serif;
}

.music-wave {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100px;
    margin-bottom: 30px;
}

.music-bar {
    background: linear-gradient(to top, #8e44ad, #3498db);
    width: 10px;
    height: 20px;
    margin: 0 3px;
    border-radius: 5px;
    animation: musicWave 1.5s infinite ease-in-out;
}

.music-bar:nth-child(2) {
    animation-delay: 0.2s;
}

.music-bar:nth-child(3) {
    animation-delay: 0.4s;
}

.music-bar:nth-child(4) {
    animation-delay: 0.6s;
}

.music-bar:nth-child(5) {
    animation-delay: 0.8s;
}

@keyframes musicWave {
    0%, 100% {
        height: 20px;
    }
    50% {
        height: 80px;
    }
}

.upload-progress {
    width: 80%;
    max-width: 400px;

<body>

  <!-- Fixed Search Box -->
  <div class="search-box">
    <input type="text" id="trackSearch" placeholder="🔍 Search by Artist, Title, Label..." onkeyup="filterTracks()" />
  </div>

  <!-- Fixed Upload Button -->
  <div class="fixed-buttons">
    <button class="upload-btn" onclick="uploadMusic()">
      <i class="fas fa-cloud-upload"></i> Upload Music
    </button>
    <button class="upload-btn" onclick="deleteSelectedTracks()">
      <i class="fas fa-trash"></i> Delete Selected
    </button>

  </div>

  <!-- Main Content -->
  <div class="glass-container">
    <h2>🎵 House Music Kitchen Track Update 🎵</h2>

    <!-- Track Table -->
    <table id="musicTable">
      <thead>
        <tr>
           <th><input type="checkbox" onclick="toggleAll(this)" /></th> <!-- 🔁 Select all -->
          <th>ID</th>
          <th>Artist</th>
          <th>Featured</th>
          <th>Title</th>
          <th>Label</th>
          <th>Genre</th>
          <th>Release</th>
          <th>Duration</th>
          <th>Price</th>
          <th>Image</th>

          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        {% for music in music_data %}
        <tr id="music-{{ music.id }}">
          <td><input type="checkbox" class="track-checkbox" data-id="{{ music.id }}"></td>
          <td>{{ music.id }}</td>
          <td><input type="text" id="artist-{{ music.id }}" value="{{ music.artist }}"></td>
          <td><input type="text" id="ft_artist-{{ music.id }}" value="{{ music.ft_artist }}"></td>
          <td><input type="text" id="title-{{ music.id }}" value="{{ music.title }}"></td>
          <td><input type="text" id="label-{{ music.id }}" value="{{ music.label }}"></td>
          <td><input type="text" id="genre-{{ music.id }}" value="{{ music.genre }}"></td>
          <td><input type="text" id="release_date-{{ music.id }}" value="{{ music.release_date }}"></td>
          <td><input type="text" id="duration-{{ music.id }}" value="{{ music.duration }}"></td>
          <td><input type="text" id="price-{{ music.id }}" value="{{ music.price }}"></td>
          <td>
            <img src="{{ music.image }}" alt="Cover" onclick="triggerImageUpload({{ music.id }})" id="image-{{ music.id }}" style="cursor:pointer;" />

            <button onclick="updateMusic({{ music.id }})">✅ Update</button>

   <!--  =====  UPDATE MUSIC ===== -->

<div id="musicUploadLoader" class="music-upload-loader" style="display: none;">

        <div class="vinyl-center"></div>

    <div class="upload-status" id="uploadStatus">Processing Your Music...</div>

  <!-- Scripts -->
  <script>
    // ===== UPDATE MUSIC =====
    function updateMusic(id) {
      const updatedData = {
        artist: document.getElementById(`artist-${id}`).value,
        ft_artist: document.getElementById(`ft_artist-${id}`).value,
        title: document.getElementById(`title-${id}`).value,
        label: document.getElementById(`label-${id}`).value,
        genre: document.getElementById(`genre-${id}`).value,
        release_date: document.getElementById(`release_date-${id}`).value,
        duration: document.getElementById(`duration-${id}`).value,
        price: document.getElementById(`price-${id}`).value
      };

      fetch(`/update-music/${id}`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(updatedData)
      })
      .then(response => response.json())
      .then(data => {
        if (data.success) {
          alert('✅ Music updated successfully!');
        } else {
          alert('❌ Error updating music: ' + data.error);
        }
      });
    }

    // ===== DELETE MUSIC =====
    function deleteMusic(id) {
      if (confirm('Are you sure you want to delete this entry?')) {
        fetch(`/delete-music/${id}`, {
          method: 'DELETE'
        })
        .then(response => response.json())
        .then(data => {
          if (data.success) {
            alert('🗑️ Music deleted successfully!');
            document.getElementById(`music-${id}`).remove();
          } else {
            alert('❌ Error deleting music: ' + data.error);
          }
        });
      }
    }

    // ===== IMAGE UPLOAD HANDLER =====
    function triggerImageUpload(id) {
      document.getElementById(`file-${id}`).click();
    }

    function uploadNewImage(id) {
      const fileInput = document.getElementById(`file-${id}`);
      const file = fileInput.files[0];
      if (!file) return;

      const formData = new FormData();
      formData.append('image', file);
      formData.append('id', id);

      fetch(`/update-music-image/${id}`, {
        method: 'POST',
        body: formData
      })
      .then(res => res.json())
      .then(data => {
        if (data.success && data.newImageUrl) {
          document.getElementById(`image-${id}`).src = data.newImageUrl + '?t=' + Date.now();
          alert("✅ Image updated successfully!");
        } else {
          alert("❌ Failed to update image.");
        }
      })
      .catch(err => {
        console.error('Error:', err);
        alert("❌ Error uploading image.");
      });
    }

    // ===== FILE UPLOAD FOR MUSIC FILES =====
async function uploadMusic() {
  const fileInput = document.createElement('input');
  fileInput.type = 'file';
  fileInput.multiple = true;
  fileInput.accept = '.mp3,.wma';

  fileInput.onchange = () => {
    const files = fileInput.files;
    if (!files.length) return;

    const formData = new FormData();
    for (let file of files) {
      formData.append('music_files[]', file);
    }

    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/upload-music', true);

    // Show loader
    document.getElementById('musicUploadLoader').style.display = 'flex';

    // Track upload progress
    xhr.upload.onprogress = function (e) {
      if (e.lengthComputable) {
        const percentComplete = (e.loaded / e.total) * 100;
        document.getElementById('uploadProgressBar').style.width = percentComplete + '%';
        document.getElementById('uploadDetails').textContent = `Uploaded ${Math.round(percentComplete)}%`;
      }
    };

    // On complete
    xhr.onload = function () {
      if (xhr.status === 200) {
        const result = JSON.parse(xhr.responseText);
        if (result.success) {
          document.getElementById('uploadDetails').textContent = "Upload complete!";
          alert("✅ " + result.added.length + " track(s) uploaded successfully!");
          location.reload();
        } else {
          alert("❌ Upload failed: " + result.error);
        }
      } else {
        alert("⚠️ Upload failed: Server error");
      }

      document.getElementById('musicUploadLoader').style.display = 'none';
    };

    xhr.onerror = function () {
      alert("⚠️ Upload failed: Network error");
      document.getElementById('musicUploadLoader').style.display = 'none';
    };

    xhr.send(formData);
  };

  fileInput.click();
}


    // ===== SEARCH FILTER =====
    function filterTracks() {
      const input = document.getElementById("trackSearch").value.toLowerCase();
      const rows = document.querySelectorAll("#musicTable tbody tr");

      rows.forEach(row => {
        const cells = row.querySelectorAll("td");
        let match = false;

        for (let i = 1; i <= 7; i++) { // Skip ID column
          const val = cells[i].querySelector("input")?.value.toLowerCase() || "";
          if (val.includes(input)) {
            match = true;
            break;
          }
        }

        row.style.display = match ? "" : "none";
      });
    }
  </script>

  <script>
  function toggleAll(source) {
    const checkboxes = document.querySelectorAll('.track-checkbox');
    checkboxes.forEach(cb => cb.checked = source.checked);
  }

function deleteSelectedTracks() {
    const selectedCheckboxes = document.querySelectorAll('.track-checkbox:checked');
    const selectedIds = Array.from(selectedCheckboxes).map(checkbox => {
        return parseInt(checkbox.getAttribute('data-id'));
    });

    if (selectedIds.length === 0) {
        alert("⚠️ Please select at least one track to delete.");
        return;
    }

    if (!confirm(`Are you sure you want to permanently delete ${selectedIds.length} track(s)? This cannot be undone.`)) {
        return;
    }

    // Show loader
    const loader = document.getElementById('musicUploadLoader');
    loader.style.display = 'flex';
    document.getElementById('uploadStatus').textContent = 'Deleting Tracks...';
    document.getElementById('uploadDetails').textContent = `Processing ${selectedIds.length} tracks`;
    document.getElementById('uploadProgressBar').style.width = '0%';

    fetch('/delete-multiple-music', {
        method: 'POST',
        headers: { 
            'Content-Type': 'application/json',
        },
        body: JSON.stringify({ ids: selectedIds })
    })
    .then(response => {
        if (!response.ok) {
            throw new Error('Network response was not ok');
        }
        return response.json();
    })
    .then(data => {
        if (data.success) {
            // Update progress bar to 100%
            document.getElementById('uploadProgressBar').style.width = '100%';
            document.getElementById('uploadStatus').textContent = '✅ Deletion Complete';
            document.getElementById('uploadDetails').textContent = data.message;

            // Remove deleted tracks from UI
            selectedIds.forEach(id => {
                const row = document.getElementById(`music-${id}`);
                if (row) row.remove();
            });

            setTimeout(() => {
                loader.style.display = 'none';
                alert(`Successfully deleted ${selectedIds.length} track(s)`);
            }, 1000);
        } else {
            throw new Error(data.error || 'Unknown error occurred');
        }
    })
    .catch(error => {
        loader.style.display = 'none';
        console.error('Error:', error);
        alert(`❌ Failed to delete tracks: ${error.message}`);
    });
}
</script>


</body>
</html>
