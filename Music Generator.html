<?php
// Read tracks from a JSON file
$tracksFile = 'Exclusive_Music_List.txt';
$tracks = [];

if (file_exists($tracksFile)) {
    $jsonContent = file_get_contents($tracksFile);
    $tracks = json_decode($jsonContent, true);

    if ($tracks === null && json_last_error() !== JSON_ERROR_NONE) {
        die("Error: Invalid JSON format in $tracksFile - " . json_last_error_msg());
    }
}

// Ensure $tracks is an array before sorting
if (!is_array($tracks)) {
    die("Error: Tracks data is not an array.");
}

// Sort tracks by artist in ascending order
usort($tracks, function ($a, $b) {
    return strcasecmp($a['artist'], $b['artist']);
});

// Group tracks by artist
$tracksByArtist = [];
foreach ($tracks as $track) {
    $artist = $track['artist'];
    if (!isset($tracksByArtist[$artist])) {
        $tracksByArtist[$artist] = [];
    }
    $tracksByArtist[$artist][] = $track;
}

<script>
// Replace your existing toggleCategory function with this:
function toggleCategory(categoryId, event) {
    event.stopPropagation(); // Prevent event from bubbling up
    
    var categoryDiv = document.getElementById(categoryId);
    var allCategories = document.querySelectorAll('.category');
    
    // Toggle the clicked category
    if (categoryDiv.style.display === "none") {
        // Hide all categories first
        allCategories.forEach(function(cat) {
            cat.style.display = "none";
        });
        // Show the clicked one
        categoryDiv.style.display = "block";
    } else {
        categoryDiv.style.display = "none";
    }
}

// Add this new click handler for the document
document.addEventListener('click', function(event) {
    // Check if we clicked outside any artist link or category
    if (!event.target.closest('.menu__item-link') && !event.target.closest('.category')) {
        var allCategories = document.querySelectorAll('.category');
        allCategories.forEach(function(cat) {
            cat.style.display = "none";
        });
    }
});

// Update your artist links in the PHP to include onclick:
<a class="menu__item-link" onclick="toggleCategory('<?php echo $artist_safe; ?>', event)"><?php echo $artist; ?></a>
</script>

<script>
    function addToCartOnce(element, trackId) {
        // Check if the link was already clicked
        if (element.classList.contains("disabled")) {
            return;
        }
    
        // Call the addToCart function
        addToCart(trackId);
    

    }

function toggleCategory(categoryId) {
    var categoryDiv = document.getElementById(categoryId);

    if (categoryDiv.style.display === "none") {
        // If hidden, show it and hide all others
        categoryDiv.style.display = "block";
        // Hide all other categories
        var allCategories = document.querySelectorAll('.category');
        allCategories.forEach(function(cat) {
            if (cat.id !== categoryId) {
                cat.style.display = "none";
            }
        });
    } else {
        // If visible, hide it
        categoryDiv.style.display = "none";
    }
}

// Add an event listener to the document to handle clicks outside of the categories
document.addEventListener('click', function(event) {
    // Get the target element of the click
    var targetElement = event.target;

    // Check if the click was outside of the category elements and menu items
    if (!targetElement.closest('.category') && !targetElement.closest('.menu__item')) {
        // Hide all categories
        var allCategories = document.querySelectorAll('.category');
        allCategories.forEach(function(cat) {
            cat.style.display = "none";
        });
    }
});
</script>
